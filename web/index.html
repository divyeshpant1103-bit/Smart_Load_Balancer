<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Load Balancer Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* Layout: the page follows a request's path. Waiting queue on the left feeds the server columns on the right; the timeline underneath shows how the queue and the cluster moved over time; the ledger records each routing decision. */
    :root {
      --bg: #101419;
      --panel: #161c23;
      --line: #2a333d;
      --ink: #e4e9ee;
      --muted: #8793a0;
      --faint: #5b6672;
      --accent: #e8b73a;
      --accent-ink: #17120a;
      --l: #5fb89a;
      --m: #d9a441;
      --h: #d8665c;
      --ok: #5fb89a;
      --bad: #d8665c;
      --down: #6b7682;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
      color-scheme: dark;
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --bg: #e9ecef;
        --panel: #f7f8f9;
        --line: #c9d0d7;
        --ink: #161d24;
        --muted: #5a6672;
        --faint: #6f7b87;
        --accent: #9a6a00;
        --accent-ink: #ffffff;
        --l: #1f8a6a;
        --m: #a8741a;
        --h: #b5443a;
        --ok: #1f8a6a;
        --bad: #b5443a;
        --down: #7b8691;
        color-scheme: light
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.45;
      padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px))
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 24px;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px
    }

    .brand {
      font-family: var(--cond);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .ribbon {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 22px;
      color: var(--muted)
    }

    .ribbon b {
      color: var(--ink);
      font-weight: 500;
      font-variant-numeric: tabular-nums
    }

    .link {
      font-size: 12px;
      color: var(--faint)
    }

    .link.ok {
      color: var(--ok)
    }

    .link.bad {
      color: var(--bad)
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center
    }

    button {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 3px
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    button.go {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 600
    }

    button.go:hover {
      color: var(--accent-ink);
      filter: brightness(1.08)
    }

    button.on {
      border-color: var(--accent);
      color: var(--accent)
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .gap {
      flex: 1
    }

    .lbl {
      font-family: var(--cond);
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
      font-size: 13px
    }

    .flow {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      border: 1px solid var(--line);
      background: var(--panel)
    }

    @media (max-width:720px) {
      .flow {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .lane {
      padding: 14px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0
    }

    @media (max-width:720px) {
      .lane {
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }
    }

    .lane h3,
    .cols h3 {
      margin: 0;
      font-family: var(--cond);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .qcount {
      font-family: var(--cond);
      font-size: 44px;
      line-height: 1;
      font-weight: 500;
      font-variant-numeric: tabular-nums
    }

    .qcount.hot {
      color: var(--accent)
    }

    .qlist {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .qitem {
      display: flex;
      justify-content: space-between;
      padding: 2px 8px;
      border-left: 4px solid var(--l);
      background: var(--bg);
      font-variant-numeric: tabular-nums
    }

    .qitem.M {
      border-color: var(--m)
    }

    .qitem.H {
      border-color: var(--h)
    }

    .qitem:first-child {
      outline: 1px solid var(--ink)
    }

    .qitem em {
      font-style: normal;
      color: var(--muted)
    }

    .qmore {
      color: var(--faint);
      padding-left: 8px
    }

    .qempty {
      color: var(--faint)
    }

    @media (max-width:720px) {
      .qlist {
        flex-direction: row;
        flex-wrap: wrap
      }
    }

    .cols {
      padding: 14px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .colhead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap
    }

    .servers {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 14px
    }

    .srv {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .srv-id {
      display: flex;
      justify-content: space-between;
      align-items: baseline
    }

    .srv-id b {
      font-family: var(--cond);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .04em
    }

    .tag {
      font-size: 11px;
      color: var(--faint);
      letter-spacing: .06em
    }

    .tag.next {
      color: var(--accent-ink);
      background: var(--accent);
      padding: 0 6px;
      border-radius: 2px;
      font-weight: 600
    }

    .tag.crashed {
      color: var(--bad)
    }

    .room {
      font-family: var(--cond);
      font-size: 34px;
      line-height: 1;
      font-weight: 500;
      font-variant-numeric: tabular-nums
    }

    .room small {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
      margin-left: 4px;
      letter-spacing: .04em
    }

    .stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px
    }

    .cell {
      height: 19px;
      border: 1px dashed var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--bg)
    }

    .cell.L {
      background: var(--l);
      border: 0
    }

    .cell.M {
      background: var(--m);
      border: 0
    }

    .cell.H {
      background: var(--h);
      border: 0
    }

    .cell span:last-child {
      opacity: .75
    }

    .srv.down .stack {
      opacity: .35
    }

    .srv.down .room {
      color: var(--down)
    }

    .srv button {
      padding: 3px 8px;
      font-size: 11px;
      align-self: flex-start
    }

    .key {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      color: var(--faint);
      font-size: 11px
    }

    .key i {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      vertical-align: -1px
    }

    .two {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: 20px
    }

    @media (max-width:860px) {
      .two {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    section h2 {
      margin: 0 0 8px;
      font-family: var(--cond);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .tl {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 8px;
      min-height: 190px
    }

    .tl svg {
      display: block;
      width: 100%;
      height: 170px
    }

    .ledger {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      height: 190px;
      overflow-y: auto
    }

    .ledger li {
      padding: 4px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px
    }

    .ledger li:last-child {
      border-bottom: 0
    }

    .ledger .t {
      color: var(--faint);
      min-width: 42px;
      font-variant-numeric: tabular-nums
    }

    .ledger .bad {
      color: var(--bad)
    }

    .hint {
      color: var(--faint);
      padding: 10px
    }

    .qitem.moved em {
      color: var(--bad)
    }

    .ledger .up {
      color: var(--ok)
    }

    .ledger .dn {
      color: var(--accent)
    }

    .srv.fresh .srv-id b {
      color: var(--ok)
    }

    .scale {
      border: 1px solid var(--accent);
      background: var(--panel);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .scale .row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-variant-numeric: tabular-nums
    }

    .scale .row .t {
      color: var(--faint);
      min-width: 42px
    }

    .scale .up {
      color: var(--ok)
    }

    .scale .dn {
      color: var(--accent)
    }

    .scale .now {
      color: var(--muted);
      margin-bottom: 4px
    }

    .scale .now b {
      color: var(--ink);
      font-weight: 500
    }

    .scale .hint {
      padding: 0
    }

    .cell.moved {
      outline: 2px solid var(--ink);
      outline-offset: -2px
    }

    .fail {
      border: 1px solid var(--bad);
      background: var(--panel);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .fail .down {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center
    }

    .fail .down span {
      color: var(--bad)
    }

    .fail .ev {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .fail .evh {
      color: var(--muted);
      margin-bottom: 2px
    }

    .fail .evh b {
      color: var(--bad);
      font-weight: 500
    }

    .fail .row {
      display: flex;
      gap: 12px;
      padding: 1px 8px;
      border-left: 4px solid var(--l);
      background: var(--bg);
      font-variant-numeric: tabular-nums
    }

    .fail .row.M {
      border-color: var(--m)
    }

    .fail .row.H {
      border-color: var(--h)
    }

    .fail .row .id {
      min-width: 48px
    }

    .fail .row .gone {
      color: var(--faint)
    }

    .rep {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel)
    }

    .rep li {
      display: grid;
      grid-template-columns: 28px 40px minmax(0, 1fr) 56px;
      gap: 10px;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums
    }

    .rep li:last-child {
      border-bottom: 0
    }

    .rep li.hint {
      display: block
    }

    .rep .rk {
      color: var(--faint)
    }

    .rep .sid {
      font-family: var(--cond);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .04em
    }

    .rep .track {
      height: 10px;
      background: var(--bg);
      border: 1px solid var(--line)
    }

    .rep .fill {
      height: 100%
    }

    .rep .fill.lo {
      background: var(--l)
    }

    .rep .fill.mid {
      background: var(--m)
    }

    .rep .fill.hi {
      background: var(--h)
    }

    .rep .pct {
      text-align: right
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">Load Balancer</div>
      <div class="ribbon" id="ribbon"></div>
      <div class="link" id="link">connecting&hellip;</div>
    </div>

    <div class="bar">
      <span class="lbl">Send</span>
      <button class="go" id="bSend">1 request</button>
      <button id="bLight">Light</button>
      <button id="bHeavy">Heavy</button>
      <button id="bBurst">Burst &times;30</button>
    </div>

    <section>
      <h2>Scaling</h2>
      <div class="scale" id="scale"></div>
    </section>

    <section id="failSec" hidden>
      <h2>Failover</h2>
      <div class="fail" id="fail"></div>
    </section>

    <section>
      <div class="flow">
        <div class="lane">
          <h3>Waiting</h3>
          <div class="qcount" id="qcount">0</div>
          <div class="qlist" id="qlist"></div>
        </div>
        <div class="cols">
          <div class="colhead">
            <h3>Servers</h3>
            <div class="key"><span><i style="background:var(--l)"></i>light</span><span><i
                  style="background:var(--m)"></i>medium</span><span><i
                  style="background:var(--h)"></i>heavy</span><span>number in a slot = ticks left</span><span>outlined =
                moved after a crash</span></div>
          </div>
          <div class="servers" id="servers"></div>
        </div>
      </div>
    </section>

    <section>
      <h2>Utilization report</h2>
      <ul class="rep" id="rep">
        <li class="hint">Waiting for the first report.</li>
      </ul>
    </section>

    <div class="two">
      <section>
        <h2>Queue length over time</h2>
        <div class="tl" id="tl"></div>
      </section>
      <section>
        <h2>Routing ledger</h2>
        <ul class="ledger" id="ledger"></ul>
      </section>
    </div>

  </div>

  <script>
    const TYPES = { L: 'light', M: 'medium', H: 'heavy' };
    let state = null, prev = null, busy = false;
    const hist = [];      // {sig, tick, queue}
    const marks = [];     // {i, label, kind}
    const ledger = [];    // {tick, html}
    const failovers = []; // {tick, from, ids:[{id,t}]}
    const scaleEvents = []; // {tick, kind:'up'|'down', id, active}
    const addedAt = new Map(); // server id -> tick it appeared
    const movedFrom = new Map(); // request id -> server it was moved off
    const $ = id => document.getElementById(id);

    async function api(method, path) {
      try {
        const r = await fetch(path, { method }); if (!r.ok) throw 0;
        prev = state; state = await r.json();
        $('link').textContent = 'live, polling backend'; $('link').className = 'link ok';
        return true;
      } catch (e) {
        $('link').textContent = 'backend not reachable'; $('link').className = 'link bad';
        return false;
      }
    }

    /* Where is every request right now? id -> 'Q' or server id. */
    function locations(s) {
      const m = new Map();
      if (!s) return m;
      s.queue.forEach(r => m.set(r.id, 'Q'));
      s.servers.forEach(v => v.slots.forEach(r => m.set(r.id, v.id)));
      return m;
    }

    /* Compare the previous and current snapshot and record what changed. */
    function diff() {
      if (!prev || !state) return;
      const a = locations(prev), b = locations(state);
      const to = {}, fromQ = {}, recovered = {}, moves = {}; let queued = 0, done = 0;
      b.forEach((loc, id) => {
        const was = a.get(id);
        if (was === undefined) { if (loc === 'Q') queued++; else to[loc] = (to[loc] || 0) + 1; }
        else if (was === 'Q' && loc !== 'Q') { fromQ[loc] = (fromQ[loc] || 0) + 1; }
        else if (was !== 'Q' && loc === 'Q') { recovered[was] = (recovered[was] || 0) + 1; }
        else if (was !== 'Q' && loc !== 'Q' && was !== loc) { const k = was + '|' + loc; moves[k] = (moves[k] || 0) + 1; }
      });
      a.forEach((loc, id) => { if (!b.has(id)) done++; });

      /* A request that leaves a server for any other place was moved by a crash. */
      const movedNow = {};
      b.forEach((loc, id) => {
        const was = a.get(id);
        if (was !== undefined && was !== 'Q' && was !== loc) { (movedNow[was] = movedNow[was] || []).push(id); movedFrom.set(id, was); }
      });
      Object.keys(movedNow).forEach(k => failovers.unshift({ tick: state.tick, from: +k, ids: movedNow[k].map(id => ({ id, t: findReq(id).t })) }));
      while (failovers.length > 4) failovers.pop();
      movedFrom.forEach((v, id) => { if (!b.has(id)) movedFrom.delete(id); });

      /* Scaling: compare server ids, not counts. A server that vanished while its
         requests were moved off it crashed; it was not scaled down. */
      const pids = prev.servers.map(v => v.id), cids = state.servers.map(v => v.id);
      const added = cids.filter(id => !pids.includes(id));
      const removed = pids.filter(id => !cids.includes(id) && !movedNow[id]);
      const nAct = state.servers.filter(v => v.active).length;
      added.forEach(id => { addedAt.set(id, state.tick); scaleEvents.unshift({ tick: state.tick, kind: 'up', id, active: nAct }); });
      removed.forEach(id => { scaleEvents.unshift({ tick: state.tick, kind: 'down', id, active: nAct }); });
      while (scaleEvents.length > 6) scaleEvents.pop();

      const parts = [];
      Object.keys(to).forEach(k => parts.push('+' + to[k] + ' &rarr; S' + k));
      Object.keys(fromQ).forEach(k => parts.push(fromQ[k] + ' from queue &rarr; S' + k));
      if (queued) parts.push(queued + ' queued, all servers full');
      Object.keys(recovered).forEach(k => parts.push('<span class="bad">' + recovered[k] + ' recovered from S' + k + ' to queue front</span>'));
      Object.keys(moves).forEach(k => { const p = k.split('|'); parts.push('<span class="bad">' + moves[k] + ' moved S' + p[0] + ' &rarr; S' + p[1] + '</span>'); });
      added.forEach(id => parts.push('<span class="up">scaled up: +S' + id + '</span>'));
      removed.forEach(id => parts.push('<span class="dn">scaled down: S' + id + ' removed</span>'));
      if (done) parts.push(done + ' done');
      if (parts.length) ledger.unshift({ tick: state.tick, html: parts.join(' &middot; ') });

      const i = hist.length;
      added.forEach(id => marks.push({ i, label: '+S' + id, kind: 'up' }));
      removed.forEach(id => marks.push({ i, label: '-S' + id, kind: 'down' }));
      state.servers.forEach(v => {
        const p = prev.servers.find(x => x.id === v.id);
        if (p && p.active && !v.active) marks.push({ i, label: 'S' + v.id + ' crash', kind: 'crash' });
        if (p && !p.active && v.active) marks.push({ i, label: 'S' + v.id + ' back', kind: 'up' });
      });
      while (ledger.length > 60) ledger.pop();
    }

    function record() {
      const last = hist[hist.length - 1];
      const sig = state.tick + '|' + state.received + '|' + state.processed + '|' + state.queue.length + '|' + state.servers.map(s => s.id + (s.active ? 'a' : 'x') + s.load).join(',');
      if (last && last.sig === sig) return;
      hist.push({ sig, tick: state.tick, queue: state.queue.length });
      if (hist.length > 70) { hist.shift(); marks.forEach(m => m.i--); while (marks.length && marks[0].i < 0) marks.shift(); }
    }

    /* Where is request id right now? null once it has finished. */
    function findReq(id) {
      const q = state.queue.find(r => r.id === id);
      if (q) return { loc: 'Q', t: q.t };
      for (const s of state.servers) {
        const r = s.slots.find(x => x.id === id);
        if (r) return { loc: s.id, t: r.t };
      }
      return null;
    }

    /* Which server will the heap pick next? Most headroom, lowest id on a tie. */
    function nextPick() {
      let best = null;
      state.servers.forEach(s => {
        if (!s.active || s.load >= state.capacity) return;
        const room = state.capacity - s.load;
        if (!best || room > best.room || (room === best.room && s.id < best.id)) best = { id: s.id, room };
      });
      return best ? best.id : null;
    }

    function render() {
      if (!state) return;
      const CAP = state.capacity;
      const act = state.servers.filter(s => s.active);
      const load = act.reduce((a, s) => a + s.load, 0), cap = act.length * CAP;
      const util = cap ? Math.round(load / cap * 100) : 0;
      $('ribbon').innerHTML =
        '<span>tick <b>' + state.tick + '</b></span>' +
        '<span>received <b>' + state.received + '</b></span>' +
        '<span>processed <b>' + state.processed + '</b></span>' +
        '<span>servers <b>' + act.length + '/' + state.servers.length + '</b></span>' +
        '<span>utilization <b>' + util + '%</b></span>';

      const q = state.queue;
      $('qcount').textContent = q.length; $('qcount').className = 'qcount' + (q.length ? ' hot' : '');
      $('qlist').innerHTML = q.length
        ? q.slice(0, 12).map(r => { const f = movedFrom.get(r.id); return '<div class="qitem ' + r.t + (f ? ' moved' : '') + '"><span>#' + r.id + '</span><em>' + (f ? 'from S' + f : TYPES[r.t]) + '</em></div>'; }).join('')
        + (q.length > 12 ? '<div class="qmore">+' + (q.length - 12) + ' more</div>' : '')
        : '<div class="qempty">nothing waiting</div>';

      const pick = nextPick();
      $('servers').innerHTML = state.servers.map(s => {
        const room = CAP - s.load;
        let cells = '';
        for (let i = 0; i < CAP; i++) {
          const r = s.slots[i];
          const mv = r && movedFrom.get(r.id);
          cells += r ? '<div class="cell ' + r.t + (mv ? ' moved' : '') + '" title="#' + r.id + ' ' + TYPES[r.t] + (mv ? ' (moved from S' + mv + ')' : '') + '"><span>#' + r.id + '</span><span>' + r.rem + '</span></div>' : '<div class="cell"></div>';
        }
        const tag = !s.active ? '<span class="tag crashed">CRASHED</span>' : (s.id === pick ? '<span class="tag next">NEXT</span>' : '<span class="tag">' + s.load + '/' + CAP + '</span>');
        const fresh = addedAt.has(s.id) && state.tick - addedAt.get(s.id) <= 10;
        return '<div class="srv' + (s.active ? '' : ' down') + (fresh ? ' fresh' : '') + '"' + (fresh ? ' title="added at tick ' + addedAt.get(s.id) + '"' : '') + '>'
          + '<div class="srv-id"><b>S' + s.id + '</b>' + tag + '</div>'
          + '<div class="room">' + (s.active ? room : '-') + '<small>free</small></div>'
          + '<div class="stack">' + cells + '</div>'
          + (s.active ? '<button data-crash="' + s.id + '">Crash</button>' : '<button data-restore="' + s.id + '">Restore</button>')
          + '</div>';
      }).join('');

      $('ledger').innerHTML = ledger.length
        ? ledger.slice(0, 40).map(l => '<li><span class="t">t' + l.tick + '</span><span>' + l.html + '</span></li>').join('')
        : '<li class="hint">Send a request to see where the balancer puts it.</li>';

      renderScale();
      renderFail();
      drawTimeline();
    }

    /* Scaling panel: current size of the cluster and the latest add/remove events. */
    function renderScale() {
      const act = state.servers.filter(s => s.active).length;
      let h = '<div class="now">servers active <b>' + act + '</b> of <b>' + state.servers.length + '</b></div>';
      h += scaleEvents.length
        ? scaleEvents.map(e => '<div class="row"><span class="t">t' + e.tick + '</span>'
          + (e.kind === 'up'
            ? '<span class="up">scaled up</span><span>+S' + e.id + ' added, ' + e.active + ' active</span>'
            : '<span class="dn">scaled down</span><span>S' + e.id + ' removed, ' + e.active + ' active</span>')
          + '</div>').join('')
        : '<div class="hint">No scaling yet. Servers are added or removed automatically as load changes.</div>';
      $('scale').innerHTML = h;
    }

    /* Failover panel: which servers are down, and where their requests went. */
    function renderFail() {
      const down = state.servers.filter(s => !s.active);
      const recent = failovers.filter(f => state.tick - f.tick <= 20);
      $('failSec').hidden = !(down.length || recent.length);
      let h = '';
      if (down.length) {
        h += '<div class="down"><span>' + down.map(s => 'S' + s.id).join(', ') + (down.length > 1 ? ' are' : ' is') + ' down.</span>'
          + down.map(s => '<button data-restore="' + s.id + '">Restore S' + s.id + '</button>').join('')
          + '<button class="go" data-add="1"' + (state.servers.length >= 10 ? ' disabled' : '') + '>Add server</button></div>';
      }
      h += recent.map(f => {
        const rows = f.ids.map(r => {
          const c = findReq(r.id);
          const where = !c ? '<span class="gone">done</span>' : (c.loc === 'Q' ? 'waiting in queue' : 'S' + c.loc);
          return '<div class="row ' + r.t + '"><span class="id">#' + r.id + '</span><span>S' + f.from + ' &rarr; ' + where + '</span></div>';
        }).join('');
        return '<div class="ev"><div class="evh">t' + f.tick + ' &middot; <b>S' + f.from + ' crashed</b>, ' + f.ids.length + ' request' + (f.ids.length > 1 ? 's' : '') + ' moved</div>' + rows + '</div>';
      }).join('');
      $('fail').innerHTML = h;
    }

    function drawTimeline() {
      const host = $('tl'), W = Math.max(300, host.clientWidth - 16), H = 170, L = 30, R = 8, T = 22, B = 18;
      const n = hist.length;
      if (n < 2) { host.innerHTML = '<div class="hint">The timeline fills as the simulation runs.</div>'; return; }
      const max = Math.max(4, ...hist.map(h => h.queue));
      const nice = Math.ceil(max / 4) * 4;
      const x = i => L + (W - L - R) * i / (n - 1), y = v => T + (H - T - B) * (1 - v / nice);
      let d = 'M' + x(0) + ',' + y(0);
      hist.forEach((h, i) => { d += ' L' + x(i) + ',' + y(h.queue); });
      d += ' L' + x(n - 1) + ',' + y(0) + ' Z';
      let line = 'M' + x(0) + ',' + y(hist[0].queue);
      hist.forEach((h, i) => { line += ' L' + x(i) + ',' + y(h.queue); });
      let grid = '';
      for (let k = 0; k <= 4; k++) {
        const v = nice * k / 4;
        grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>'
          + '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" fill="var(--faint)" font-size="10">' + Math.round(v) + '</text>';
      }
      const col = { up: 'var(--ok)', crash: 'var(--bad)', down: 'var(--accent)' };
      let ev = '';
      marks.forEach(m => {
        if (m.i < 0 || m.i >= n) return;
        const px = x(m.i), c = col[m.kind];
        ev += '<line x1="' + px + '" x2="' + px + '" y1="' + (T - 4) + '" y2="' + (H - B) + '" stroke="' + c + '" stroke-width="1" stroke-dasharray="3 3"/>'
          + '<text x="' + Math.min(px + 3, W - R - 44) + '" y="' + (T - 8) + '" fill="' + c + '" font-size="10">' + m.label + '</text>';
      });
      const t0 = hist[0].tick, t1 = hist[n - 1].tick;
      host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Queue length over time" style="font-family:var(--mono)">'
        + grid
        + '<path d="' + d + '" fill="var(--accent)" fill-opacity=".18"/>'
        + '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="1.6"/>'
        + ev
        + '<text x="' + L + '" y="' + (H - 3) + '" fill="var(--faint)" font-size="10">tick ' + t0 + '</text>'
        + '<text x="' + (W - R) + '" y="' + (H - 3) + '" text-anchor="end" fill="var(--faint)" font-size="10">tick ' + t1 + '</text></svg>';
    }

    async function loadReport() {
      try {
        const r = await fetch('/report'); if (!r.ok) throw 0;
        const d = await r.json();
        $('rep').innerHTML = d.report.length ? d.report.map(e => {
          const w = Math.min(100, e.utilization);
          const c = e.utilization >= 90 ? 'hi' : (e.utilization >= 60 ? 'mid' : 'lo');
          return '<li><span class="rk">#' + e.rank + '</span><span class="sid">S' + e.serverId + '</span>'
            + '<div class="track"><div class="fill ' + c + '" style="width:' + w + '%"></div></div>'
            + '<span class="pct">' + e.utilization.toFixed(1) + '%</span></li>';
        }).join('') : '<li class="hint">No active servers.</li>';
      } catch (e) { }
    }
    function after() { record(); render(); loadReport(); }
    async function act(method, path) {
      if (busy) return; busy = true;
      if (await api(method, path)) { diff(); after(); }
      busy = false;
    }
    async function poll() {
      if (busy) return; busy = true;
      if (await api('GET', '/state')) { diff(); after(); }
      busy = false;
    }

    $('bSend').onclick = () => act('POST', '/request');
    $('bLight').onclick = () => act('POST', '/request?type=L');
    $('bHeavy').onclick = () => act('POST', '/request?type=H');
    $('bBurst').onclick = () => act('POST', '/request?n=30&type=M');
    $('servers').addEventListener('click', e => {
      const c = e.target.closest('[data-crash]'), r = e.target.closest('[data-restore]');
      if (c) act('POST', '/server/crash?id=' + c.dataset.crash);
      if (r) act('POST', '/server/restore?id=' + r.dataset.restore);
    });
    $('fail').addEventListener('click', e => {
      const r = e.target.closest('[data-restore]'), a = e.target.closest('[data-add]');
      if (r) act('POST', '/server/restore?id=' + r.dataset.restore);
      if (a) act('POST', '/server/add');
    });
    window.addEventListener('resize', () => { if (state) drawTimeline(); });

    /* Live connection: follow the backend even when ticks come from elsewhere. */
    poll();
    setInterval(poll, 1000);
  </script>
</body>
